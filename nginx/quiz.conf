server {
    listen 80;
    server_name my_website;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name my_website;

    ssl_certificate /etc/letsencrypt/live/my_websitefullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/my_website/privkey.pem;

    location /media/ {
    alias /var/www/quiz/media/;
    }
    
    location /static/ {
        alias /var/www/quiz/static/;
    }

    client_max_body_size 50M;

    location / {
        proxy_pass http://quiz:8000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # Nicht in Google listen
        add_header  X-Robots-Tag "noindex, nofollow, nosnippet, noarchive";
    }
}